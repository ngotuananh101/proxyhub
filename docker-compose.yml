services:
  redis:
    image: redis:8-alpine
    container_name: proxyhub-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - proxyhub-network

  postgres:
    image: postgres:18-alpine
    container_name: proxyhub-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USERNAME:-proxyhub}
      - "POSTGRES_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env}"
      - POSTGRES_DB=${DB_DATABASE:-proxyhub}
    volumes:
      # postgres:18+ expects the mount at /var/lib/postgresql and stores
      # data in a version-specific subdirectory (enables pg_upgrade).
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-proxyhub} -d $${POSTGRES_DB:-proxyhub}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - proxyhub-network

  # One container runs the API, Celery worker, Celery beat, and the proxy
  # gateway under supervisor (see deploy/supervisor.conf).
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proxyhub-app
    restart: unless-stopped
    env_file:
      - .env
    # A mapping (not a list) so docker-compose.external.yml can replace
    # individual keys when deploying against external Postgres/Redis.
    environment:
      DB_CONNECTION: postgresql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-proxyhub}
      DB_USERNAME: ${DB_USERNAME:-proxyhub}
      DB_PASSWORD: ${DB_PASSWORD}
      # The bundled postgres does not speak TLS; blank any DB_SSLMODE (e.g.
      # require for Aiven) that .env would otherwise leak into this container.
      DB_SSLMODE: ""
      # Default to the bundled redis service. To use a Redis already running
      # on the host, set DOCKER_QUEUE_* in .env (e.g.
      # redis://host.docker.internal:6379/1); extra_hosts makes that name
      # resolve on Linux too. For external Postgres/Redis (e.g. Aiven), layer
      # docker-compose.external.yml with -f (see README).
      QUEUE_BROKER_URL: ${DOCKER_QUEUE_BROKER_URL:-redis://redis:6379/1}
      QUEUE_RESULT_BACKEND: ${DOCKER_QUEUE_RESULT_BACKEND:-redis://redis:6379/2}
      # Gateway shares this container, so it reaches the API over loopback.
      GATEWAY_API_URL: http://127.0.0.1:8000/internal/proxies
      GATEWAY_SESSION_URL: http://127.0.0.1:8000/internal/gateway/session
      GATEWAY_LOG_URL: http://127.0.0.1:8000/internal/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
      - "127.0.0.1:${GATEWAY_PORT:-8899}:8899"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - proxyhub-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_WS_URL: ${VITE_WS_URL:-}
    container_name: proxyhub-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      app:
        condition: service_started
    networks:
      - proxyhub-network

volumes:
  postgres_data:
  redis_data:

networks:
  proxyhub-network:
    driver: bridge
