[supervisord]
nodaemon=true
# Runs as the image's unprivileged `proxyhub` user (the Dockerfile's USER);
# PID 1 here is supervisord, which does not need root.
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

# An RPC socket in /tmp (the one place the unprivileged user may write) so
# `docker exec <container> supervisorctl status` works: without it supervisord
# has no control interface at all and the status of the worker and beat — which
# crash loops that /healthz cannot see — is invisible from outside.
[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:api]
command=uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker]
command=celery -A app.worker.celery_app worker --loglevel=info
directory=/app
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:beat]
command=celery -A app.worker.celery_app beat --loglevel=info
directory=/app
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:gateway]
command=python -m proxy --plugins app.gateway.plugin.RotateProxyPlugin --hostname 0.0.0.0 --port 8899
directory=/app
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
